<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyTrack</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: min(680px, 90vw);
            height: 100vh;
        }

        .archive {
            width: 100%;
            height: 100%;
            overflow: hidden;

            mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                black 12%,
                black 88%,
                transparent 100%
            );

            -webkit-mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                black 12%,
                black 88%,
                transparent 100%
            );
        }

        .versions {
            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 42vh 0;

            transition: transform 220ms ease;
        }

        .version {
            width: 100%;
            padding: 15px 24px;

            border: 0;
            background: none;

            color: #222;

            font: inherit;
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 500;
            letter-spacing: -0.03em;
            text-align: center;

            cursor: pointer;
            outline: none;
            user-select: none;

            transition:
                color 180ms ease,
                transform 180ms ease;
        }

        .version.selected {
            color: #fff;
            transform: scale(1.04);
        }

        .version:hover {
            color: #aaa !important;
        }

        .version.selected:hover {
            color: #fff !important;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="archive" id="archive">
            <div class="versions" id="versions">
                <button class="version" data-version="0.1.1">0.1.1</button>
                <button class="version" data-version="0.2.0">0.2.0</button>
                <button class="version" data-version="0.3.0">0.3.0</button>
                <button class="version" data-version="0.3.1">0.3.1</button>
                <button class="version" data-version="0.4.0">0.4.0</button>
                <button class="version" data-version="0.4.1">0.4.1</button>
                <button class="version" data-version="0.4.2">0.4.2</button>
                <button class="version" data-version="0.5.0">0.5.0</button>
                <button class="version" data-version="0.5.1">0.5.1</button>
                <button class="version" data-version="0.5.2">0.5.2</button>
                <button class="version" data-version="0.6.0">0.6.0</button>
                <button class="version" data-version="0.6.1">0.6.1</button>
                <button class="version" data-version="0.6.2">0.6.2</button>
                <button class="version" data-version="0.6.3">0.6.3</button>
            </div>
        </div>
    </main>

    <script>
        const versions = [
            ...document.querySelectorAll(".version")
        ];

        let selected = 0;

        function update() {
            versions.forEach((element, index) => {
                const distance = Math.abs(index - selected);
                const brightness = Math.max(
                    0.06,
                    Math.pow(0.48, distance)
                );

                const value = Math.round(255 * brightness);

                element.style.color =
                    `rgb(${value}, ${value}, ${value})`;

                element.classList.toggle(
                    "selected",
                    index === selected
                );
            });

            versions[selected].scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }

        function moveSelection(direction) {
            const next = selected + direction;

            if (
                next < 0 ||
                next >= versions.length
            ) {
                return;
            }

            selected = next;
            update();
        }

        function openSelected() {
            const version =
                versions[selected].dataset.version;

            window.location.href =
                `${version}/index.html`;
        }

   
        document.addEventListener(
            "wheel",
            (event) => {
                event.preventDefault();

                if (event.deltaY > 0) {
                    moveSelection(1);
                } else if (event.deltaY < 0) {
                    moveSelection(-1);
                }
            },
            { passive: false }
        );

   
        versions.forEach((element, index) => {
            element.addEventListener("click", () => {
                selected = index;
                update();
                openSelected();
            });
        });


        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowDown") {
                event.preventDefault();
                moveSelection(1);
            }

            if (event.key === "ArrowUp") {
                event.preventDefault();
                moveSelection(-1);
            }

            if (event.key === "Enter") {
                event.preventDefault();
                openSelected();
            }

            if (event.key === "Home") {
                event.preventDefault();
                selected = 0;
                update();
            }

            if (event.key === "End") {
                event.preventDefault();
                selected = versions.length - 1;
                update();
            }
        });

        update();
    </script>
</body>
</html>
